name: Generate Snake Animation
 
on:
  schedule:
    # Har 12 soatda yangilanadi
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
 
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
 
    steps:
      - name: Ilon animatsiyasini yaratish
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark
            dist/snake-light.svg
            dist/snake.gif?color_snake=#8E2DE2&color_dots=#161b22,#4A00E0,#8E2DE2,#2193b0,#ffffff
 
      - name: output branch'ga yuklash
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 
